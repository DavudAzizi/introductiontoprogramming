{% extends "layout.html" %}

{% block body %}
    <h1>Registrants</h1>

    <table>
        <tr>
            <th>Name</th>
            <th>Sport</th>
        </tr>

        {% for name in registrants %}
            <tr>
                <td>{{ name }}</td>
                <td>{{ registrants[name] }}</td>
            </tr>
        {% endfor %}
    </table>
{% endblock %}
