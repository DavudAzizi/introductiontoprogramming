<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Final Project - Study Planner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Study Planner</h1>
        <p>Plan your lessons, save tasks, and track progress.</p>
    </header>

    <main>
        <section class="card">
            <h2>Add Study Task</h2>

            <form id="taskForm">
                <input type="text" id="subject" placeholder="Subject">
                <input type="text" id="task" placeholder="Task">
                <button type="submit">Add Task</button>
            </form>
        </section>

        <section class="card">
            <h2>Your Tasks</h2>
            <ul id="taskList"></ul>
            <button id="clearTasks">Clear All</button>
        </section>

        <section class="card">
            <h2>Motivation</h2>
            <button id="quoteButton">Get Quote</button>
            <p id="quote"></p>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
