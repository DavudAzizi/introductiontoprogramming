<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Exercise</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">DavudSite</a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav"
            >
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="#">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">Projects</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">Contact</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <header class="bg-primary text-white text-center py-5">
        <div class="container">
            <h1>Bootstrap Layout</h1>
            <p>Responsive design using Bootstrap 5.</p>
        </div>
    </header>

    <main class="container my-5">

        <div class="row g-4">

            <div class="col-md-4">
                <div class="card h-100 shadow">
                    <div class="card-body">
                        <h3 class="card-title">HTML</h3>
                        <p class="card-text">
                            HTML creates structure for websites.
                        </p>
                        <button class="btn btn-primary">
                            Learn More
                        </button>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card h-100 shadow">
                    <div class="card-body">
                        <h3 class="card-title">CSS</h3>
                        <p class="card-text">
                            CSS controls design and layout.
                        </p>
                        <button class="btn btn-success">
                            Learn More
                        </button>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card h-100 shadow">
                    <div class="card-body">
                        <h3 class="card-title">JavaScript</h3>
                        <p class="card-text">
                            JavaScript makes websites interactive.
                        </p>
                        <button class="btn btn-danger">
                            Learn More
                        </button>
                    </div>
                </div>
            </div>

        </div>

    </main>

    <footer class="bg-dark text-white text-center py-3">
        <p>© 2026 Davud Azizi</p>
    </footer>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>
</html>
